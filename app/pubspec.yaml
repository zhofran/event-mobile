name: event_apni
description: The main app of flutter advanced boilerplate.
publish_to: none
version: 1.7.1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.6
  deps:
    path: ../deps
  flutter:
    sdk: flutter

dev_dependencies:
  pyramid_lint: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - ../design/assets/images/
    - ../design/assets/images/logos/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: ../design/assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraLight.ttf
          weight: 200
name: design
description: The design system of flutter advanced boilerplate.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  deps:
    path: ../deps
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9

dev_dependencies:
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  pyramid_lint: ^1.3.0
  slang_build_runner: ^3.29.0
  theme_tailor: ^3.0.1
  widgetbook_generator: ^3.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/icons/
    - assets/images/icons/arrow/
    - assets/images/icons/building/
    - assets/images/icons/bussines/
    - assets/images/icons/communication/
    - assets/images/icons/design/
    - assets/images/icons/development/
    - assets/images/icons/device/
    - assets/images/icons/document/
    - assets/images/icons/editor/
    - assets/images/icons/finance/
    - assets/images/icons/food/
    - assets/images/icons/helath/
    - assets/images/icons/logo/
    - assets/images/icons/map/
    - assets/images/icons/media/
    - assets/images/icons/other/
    - assets/images/icons/system/
    - assets/images/icons/user_faces/
    - assets/images/icons/weather/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-ExtraLight.ttf
          weight: 200

flutter_gen:
  output: lib/_core/constants/
  line_length: 120
  integrations:
    flutter_svg: true

name: event_mobile

repository:
  type: github
  origin: https://github.com/zhofran/event-mobile.git
  owner: elisofttechnology
  name: event_mobile

# To tell melos to use fvm as flutter sdk
sdkPath: .fvm/flutter_sdk

packages:
  - app
  - deps
  - design
  - features/**
  - infrastructure

command:
  version:
    # Only allow versioning to happen on main branch.
    branch: main
    # Generate commit links in package changelogs.
    linkToCommits: true
    # Additionally build a changelog at the root of the workspace.
    workspaceChangelog: true

  bootstrap:
    # If a dependency from environment, dependencies or dev_dependencies
    # in the melos.yaml exists in a package, the dependency version in this
    # package will be updated to match the version defined in the bootstrap
    # config every time melos bootstrap is run.
    environment:
      sdk: ">=3.2.6 <4.0.0"
      flutter: ">=3.16.9 <4.0.0"

    # It seems so that running "pub get" in parallel has some issues (like
    # https://github.com/dart-lang/pub/issues/3404). Disabling this feature
    # makes the CI much more stable.
    runPubGetInParallel: false

    # To run something such as a build runner automatically after melos bootstrap
    hooks:
      pre: fvm flutter pub get
      post: melos generate


# We are setting the concurrency to 1 in some commands because a higher
# concurrency can crash the analysis server on low performance machines
# (like GitHub Actions).
scripts:
  reset:
    description: Clean things very deeply by removing untracked files.
    run: fvm flutter clean && git clean -x -d -f -q -e .fvm

  clean:pods:
    description: Clean ios pods to fix any pods related issues.
    run: |
      cd app/ios && \
      rm -Rf Pods || true && \
      rm Podfile.lock || true && \
      pod install --repo-update

  check:
    description: Run all targets generally expected in CI for a full local quality check.
    run:  |
      melos run reset && \
      melos clean && \
      melos bootstrap && \
      melos analyze && \
      melos format && \

  analyze:
    description: Analyzes all packages.
    run: |
      melos exec -c 5 -- \
        dart analyze --fatal-infos . && \
        dart run custom_lint .

  format:
    description: Formats all packages.
    run: dart format .

  format-check:
    description: Run `dart format` checks for all packages.
    run: melos exec dart format . --set-exit-if-changed

  generate:
    description: Generate codes and assets for all packages.
    run: |
      echo Generating assets for design package...
      cd design && fluttergen && cd ..
      echo Generating codes for all packages...
      melos exec -c 1 --depends-on="build_runner" -- fvm dart run build_runner build -d

  generate:watch:
    description: Watch and generate codes automatically when files change.
    run: |
      echo Initial asset generation for design package...
      cd design && fluttergen && cd ..
      echo Starting watch mode for code generation...
      melos exec -c 1 --depends-on="build_runner" -- fvm dart run build_runner watch -d

  generate:assets:
    description: Generate assets only for design package.
    run: |
      echo Generating assets for design package...
      cd design && fluttergen && cd ..

  watch:dev:
    description: Watch mode for development - runs generate and analyze on file changes.
    run: |
      echo "Starting watch mode for development..."
      melos run generate:watch

  # Tests
  test:
    description: Run all Flutter tests in this project.
    run: melos run test:select --no-select

  test:select:
    description: Run `flutter test` for selected packages.
    run: melos exec -c 1 -- flutter test
    packageFilters:
      dirExists: test

  test:coverage:
    description: Generate coverage for the selected package.
    run: |
      melos exec -c 4 --fail-fast -- \
        flutter test --coverage

  test:update-goldens:
    description: Re-generate all golden test files.
    run: melos exec -- flutter test --update-goldens
    packageFilters:
      dirExists: test

  # Builds
  build:all:
    run: |
      melos run build:example_ios_pub --no-select && \
      melos run build:example_android_pub --no-select
    description: Build all example apps.
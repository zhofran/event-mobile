name: feature_core
description: Core for all features of flutter advanced boilerplate.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  deps:
    path: ../../deps
  feature_auth:
    path: ../auth
  feature_cart:
    path: ../cart
  feature_company_profile:
    path: ../company_profile
  feature_discover:
    path: ../discover
  feature_job_applied:
    path: ../job_applied
  feature_job_listing:
    path: ../job_listing
  feature_settings:
    path: ../settings
  feature_user:
    path: ../user
  feature_event:
    path: ../event
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  auto_route_generator: ^8.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  pyramid_lint: ^1.3.0
  slang_build_runner: ^3.29.0
